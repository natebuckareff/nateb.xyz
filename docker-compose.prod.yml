name: natebxyz

x-domain: &domain nateb.xyz

services:
  caddy_proxy:
    image: lucaslorentz/caddy-docker-proxy:2.13-alpine
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp
    environment:
      CADDY_INGRESS_NETWORKS: natebxyz_caddy_ingress
    networks:
      - caddy_ingress
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - caddy_data:/data
    restart: unless-stopped

  site:
    # IMAGE_TAG is set by scripts/,deploy.sh to the commit being deployed
    image: natebxyz-site:${IMAGE_TAG:-latest}
    build:
      context: ./site
      dockerfile: dockerfile.prod
      args:
        NODE_VERSION: '24'
        PNPM_VERSION: 12.17.0
        VITE_DOMAIN: *domain
    environment:
      ENV: production
      SITE_SQLITE_FILE: /data/natebxyz.sqlite
    networks:
      - default
      - caddy_ingress
    volumes:
      - site_data:/data
    labels:
      caddy: *domain
      caddy.reverse_proxy: '{{upstreams 3000}}'
    restart: unless-stopped

networks:
  caddy_ingress:
    driver: bridge

volumes:
  caddy_data: {}
  site_data: {}
