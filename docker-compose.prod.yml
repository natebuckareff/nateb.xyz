services:
  caddy_proxy:
    image: lucaslorentz/caddy-docker-proxy:2.13-alpine
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp
    environment:
      CADDY_INGRESS_NETWORKS: ${COMPOSE_PROJECT_NAME}_caddy_ingress
    networks:
      - caddy_ingress
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - caddy_data:/data
    restart: unless-stopped

  site:
    image: ${COMPOSE_PROJECT_NAME}-site:latest
    build:
      context: ./site
      dockerfile: dockerfile.prod
      args:
        - PNPM_VERSION
        - NODE_VERSION
        - VITE_DOMAIN
    environment:
      - ENV=production
      - VITE_DOMAIN
      - SITE_SQLITE_FILE
    networks:
      - default
      - caddy_ingress
    volumes:
      - site_data:/data
    labels:
      caddy: ${VITE_DOMAIN}
      caddy.reverse_proxy: '{{upstreams 3000}}'
    restart: unless-stopped

networks:
  caddy_ingress:
    driver: bridge

volumes:
  caddy_data: {}
  site_data: {}
