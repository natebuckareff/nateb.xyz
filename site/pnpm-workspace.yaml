# Install scripts are blocked unless listed here as true
allowBuilds:
  better-sqlite3: true
  esbuild: false

# Refuse package versions published less than 7 days ago (in minutes)
minimumReleaseAge: 10080

# Force patched versions of vulnerable transitive dependencies
overrides:
  # solid-start 0.3 pins undici 5 but only imports File from it
  undici: 6.29.1
